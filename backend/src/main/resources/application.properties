# ==============================
# Server - Render
# ==============================
server.port=${PORT:8080}

# ==============================
# PostgreSQL - Neon
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/neondb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==============================
# JWT Authentication
# ==============================
app.jwt.secret=${JWT_SECRET:flowzenix-default-jwt-secret-key-must-be-at-least-32-bytes-long-for-hs256}
app.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# ==============================
# CORS - Configurable for Vercel & Local Dev
# ==============================
app.cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:${CORS_ORIGINS:${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}}}

# ==============================
# Flyway Database Migrations
# ==============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ==============================
# Gmail SMTP (Optional)
# ==============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@flowzenix.com}

# ==============================
# AI Integration (Optional)
# ==============================
app.ai.enabled=${AI_ENABLED:false}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.timeout-ms=${AI_TIMEOUT_MS:5000}

# ==============================
# File Storage
# ==============================
app.storage.upload-dir=${STORAGE_UPLOAD_DIR:./uploads/invoices}

# ==============================
# Logging Configuration
# ==============================
logging.level.root=INFO
logging.level.com.example.authapp=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO

# ==============================
# Swagger / OpenAPI
# ==============================
springdoc.swagger-ui.path=/doc
