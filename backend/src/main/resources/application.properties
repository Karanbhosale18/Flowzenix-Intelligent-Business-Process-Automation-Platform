# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# PostgreSQL Datasource
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/authapp_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT
# ==============================
# 256-bit+ secret, replace in production and load from an env var / secrets manager instead
app.jwt.secret=${JWT_SECRET:ThisIsASecretKeyForJWTPleaseChangeItInProductionEnvironment123456}
# 24 hours in ms
app.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# ==============================
# CORS (frontend dev server)
# ==============================
app.cors.allowedOrigins=${CORS_ORIGINS:http://localhost:5173}
